name: Desktop apps

# Builds the double-click apps. PyInstaller can't cross-compile, so each OS
# builds on its own runner:
#   macOS (Apple Silicon) → ClaudeStalker-<ver>-macos-arm64.dmg
#   Windows               → ClaudeStalker-Setup-<ver>.exe + a portable .zip
#
# Run it from the Actions tab ("Run workflow"), or push a tag like v0.25.0
# to also attach the files to a GitHub Release.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"

      - name: Install frontend dependencies
        run: cd frontend && bun install --frozen-lockfile

      - name: Install Inno Setup (Windows installer)
        if: runner.os == 'Windows'
        run: |
          if [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then
            choco install innosetup -y --no-progress
          fi

      - name: Build desktop app
        run: make desktop

      - uses: actions/upload-artifact@v4
        with:
          name: claude-stalker-${{ runner.os }}
          path: |
            dist/desktop/*.dmg
            dist/desktop/*.exe
            dist/desktop/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true
