[project]
name = "claude-stalker"
version = "0.25.0"
description = "Cozy isometric office that shows what Claude Code is doing, live"
readme = "README.pypi.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "overtae" }]
keywords = ["claude-code", "visualization", "isometric", "office", "agents", "hooks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "fastapi>=0.143.2",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.2",
    "sqlalchemy>=2.1.4",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "httpx>=0.28.1",
    "aiosqlite>=0.22.1",
    "rich>=15.0.0",
    "greenlet>=3.5.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "pyright>=1.1.414",
    "pre-commit>=4.7.0",
]

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "W",
    "UP",
    "B",
    "C4",
    "SIM",
]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = [
    "app",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "tests",
]
timeout = 5

[project.urls]
Homepage = "https://github.com/overtae/claude-stalker"
Source = "https://github.com/overtae/claude-stalker"
Issues = "https://github.com/overtae/claude-stalker/issues"

[project.scripts]
claude-stalker = "app.launcher.cli:main"

[tool.hatch.build.targets.wheel]
packages = [
    "app",
]
# Built by scripts/build-dist.sh and git-ignored, so list them explicitly.
artifacts = [
    "app/static/**",
    "app/_bundled/**",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.1",
    "pre-commit>=4.7.0",
    # ARC-010: contract test imports hooks' event_mapper, which depends on
    # defusedxml for <task-notification> parsing. Test-only; not a runtime dep.
    "defusedxml>=0.7.1",
    # Stub-only peer dep for Starlette/FastAPI TestClient typing (pyright).
    # NOT unused: removing it makes `make typecheck` fail on TestClient.get/post
    # in the test suite. Kept intentionally. (Re-evaluates ARC-022's "unused" call.)
    "httpx2>=2.13.1",
]
